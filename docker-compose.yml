version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  aegisai:
    build: .
    ports:
      - "8080:8080"
    environment:
      - BACKEND_TYPE=ollama
      - BACKEND_URL=http://ollama:11434
      - HOST=0.0.0.0
    volumes:
      - aegisai_data:/app/data
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
  aegisai_data:
