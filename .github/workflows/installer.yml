name: Windows installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the installer to (optional)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Ensure Inno Setup 6 is available
        shell: pwsh
        run: |
          $candidates = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          if (-not ($candidates | Where-Object { Test-Path $_ })) {
            Write-Host 'Inno Setup 6 not preinstalled; installing via Chocolatey...'
            choco install innosetup -y --no-progress
          }
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) { throw 'Inno Setup 6 was not found after installation' }
          Write-Host "Using ISCC: $found"

      - name: Compile installer
        shell: pwsh
        run: .\installer\build.ps1

      - name: Verify output and attach to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $exe = "installer\output\AegisAI-Next-Setup-$version.exe"
          if (-not (Test-Path $exe)) { throw "Expected installer was not produced: $exe" }
          Write-Host "Built: $exe"
          if ($env:RELEASE_TAG) {
            gh release upload $env:RELEASE_TAG $exe --clobber
          } else {
            Write-Host 'No release tag (manual run); skipping release upload.'
          }

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: AegisAI-Next-Setup
          path: installer/output/*.exe
          if-no-files-found: error
